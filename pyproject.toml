[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rl-projects"
version = "0.1.0"
description = "Reinforcement learning agents and environments, including Snake, Pong, and Gungi."
readme = "readme.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "gymnasium[atari,box2d,classic_control,mujoco]",
    "swig",
    "pygame",
    "numpy<2",
    "tensorboard",
    "pufferlib>=0.7.3",
    "torch",
    "modal>=1.2.4",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/gungi",
    "src/pong",
    "src/snake",
]
